<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100"><rect width="1200" height="1100" rx="22" fill="white"/><g font-family="Pretendard,Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="50" y="72" font-size="36" font-weight="750" fill="#143762">입력 한도 안에 여러 채팅방의 근거 확보</text><rect x="50" y="115" width="1100" height="370" rx="14" fill="#f4f7fc" stroke="#dbe4f1" stroke-width="2"/><text x="80" y="168" font-size="30" font-weight="700" fill="#143762">입력 형식 경량화</text><text x="80" y="216" font-size="27" font-weight="400" fill="#52637e">반복되는 JSON 필드 → 간결한 플랫텍스트</text><text x="80" y="286" font-size="25" font-weight="400" fill="#52637e">JSON</text><rect x="280" y="252" width="770" height="45" rx="7" fill="#d4deed" stroke="#d4deed" stroke-width="2"/><text x="80" y="354" font-size="25" font-weight="650" fill="#143762">플랫텍스트</text><rect x="280" y="320" width="308" height="45" rx="7" fill="#365cf5" stroke="#365cf5" stroke-width="2"/><text x="80" y="432" font-size="30" font-weight="750" fill="#143762">동일 대화 샘플의 입력 토큰 약 60% 절감</text><rect x="50" y="520" width="1100" height="520" rx="14" fill="#f4f7fc" stroke="#dbe4f1" stroke-width="2"/><text x="80" y="575" font-size="30" font-weight="700" fill="#143762">채팅방별 기본 분량 + 남는 예산 재배분</text><text x="80" y="622" font-size="25" font-weight="400" fill="#52637e">특정 대형 채팅방에 근거가 쏠리지 않도록 배분</text><rect x="80" y="665" width="244" height="104" rx="14" fill="#edf3ff" stroke="#cbd9f1" stroke-width="2"/><text x="108" y="707" font-size="27" font-weight="700" fill="#143762">방 A</text><text x="108" y="746" font-size="23" font-weight="400" fill="#52637e">기본 분량 확보</text><rect x="352" y="665" width="244" height="104" rx="14" fill="#edf3ff" stroke="#cbd9f1" stroke-width="2"/><text x="380" y="707" font-size="27" font-weight="700" fill="#143762">방 B</text><text x="380" y="746" font-size="23" font-weight="400" fill="#52637e">기본 분량 확보</text><rect x="624" y="665" width="244" height="104" rx="14" fill="#edf3ff" stroke="#cbd9f1" stroke-width="2"/><text x="652" y="707" font-size="27" font-weight="700" fill="#143762">방 C</text><text x="652" y="746" font-size="23" font-weight="400" fill="#52637e">기본 분량 확보</text><rect x="896" y="665" width="244" height="104" rx="14" fill="#edf3ff" stroke="#cbd9f1" stroke-width="2"/><text x="924" y="707" font-size="27" font-weight="700" fill="#143762">방 D</text><text x="924" y="746" font-size="23" font-weight="400" fill="#52637e">기본 분량 확보</text><text x="575" y="814" font-size="35" font-weight="600" fill="#8a9bb6">↓</text><rect x="80" y="838" width="1040" height="77" rx="14" fill="#fff4e9" stroke="#f3d4b4" stroke-width="2"/><text x="115" y="887" font-size="28" font-weight="650" fill="#9d4c11">사용하지 않은 예산 회수 → 더 필요한 방에 비례 재배분</text><text x="80" y="982" font-size="27" font-weight="700" fill="#143762">작은 방의 근거 보호 · 남은 예산 재활용</text></g></svg>