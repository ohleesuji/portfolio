<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050"><rect width="1200" height="1050" rx="24" fill="#fff"/><g font-family="Pretendard,Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="55" y="72" font-size="36" font-weight="700" fill="#143762">실제 질문을 분석 기준으로 연결</text><text x="55" y="155" font-size="58" font-weight="750" fill="#143762">40,216건</text><text x="405" y="150" font-size="29" font-weight="400" fill="#647087">한 달간 대화연동 질문 분석</text><rect x="55" y="200" width="1090" height="122" rx="16" fill="#f5f7fb" stroke="#dce4ef" stroke-width="2"/><rect x="80" y="229" width="62" height="62" rx="31" fill="#143762" stroke="#143762" stroke-width="2"/><text x="93" y="270" font-size="26" font-weight="700" fill="#fff">01</text><text x="170" y="253" font-size="30" font-weight="700" fill="#143762">이용 목적</text><text x="430" y="249" font-size="27" font-weight="650" fill="#172033">정보 찾기 · 요약 · 관계 분석 등</text><text x="430" y="290" font-size="25" font-weight="400" fill="#647087">무엇을 하려는 요청인지 구분</text><rect x="55" y="345" width="1090" height="122" rx="16" fill="#f5f7fb" stroke="#dce4ef" stroke-width="2"/><rect x="80" y="374" width="62" height="62" rx="31" fill="#143762" stroke="#143762" stroke-width="2"/><text x="93" y="415" font-size="26" font-weight="700" fill="#fff">02</text><text x="170" y="398" font-size="30" font-weight="700" fill="#143762">조회 조건</text><text x="430" y="394" font-size="27" font-weight="650" fill="#172033">기간 · 대상 · 응답 방식</text><text x="430" y="435" font-size="25" font-weight="400" fill="#647087">이용 목적과 질문의 조건을 분리</text><rect x="55" y="490" width="1090" height="122" rx="16" fill="#f5f7fb" stroke="#dce4ef" stroke-width="2"/><rect x="80" y="519" width="62" height="62" rx="31" fill="#143762" stroke="#143762" stroke-width="2"/><text x="93" y="560" font-size="26" font-weight="700" fill="#fff">03</text><text x="170" y="543" font-size="30" font-weight="700" fill="#143762">요청 관계</text><text x="430" y="539" font-size="27" font-weight="650" fill="#172033">새 요청 · 후속 질문 · 복수 목적</text><text x="430" y="580" font-size="25" font-weight="400" fill="#647087">이어진 질문도 현재 목적을 판단</text><rect x="55" y="635" width="1090" height="122" rx="16" fill="#f5f7fb" stroke="#dce4ef" stroke-width="2"/><rect x="80" y="664" width="62" height="62" rx="31" fill="#143762" stroke="#143762" stroke-width="2"/><text x="93" y="705" font-size="26" font-weight="700" fill="#fff">04</text><text x="170" y="688" font-size="30" font-weight="700" fill="#143762">분류 상태</text><text x="430" y="684" font-size="27" font-weight="650" fill="#172033">분류 가능 · 판단 불가 · 범위 밖</text><text x="430" y="725" font-size="25" font-weight="400" fill="#647087">미분류와 서비스 범위 밖을 구분</text><text x="582" y="811" font-size="39" font-weight="600" fill="#8d9db7">↓</text><rect x="55" y="835" width="1090" height="155" rx="16" fill="#edf3ff" stroke="#cbd9f1" stroke-width="2"/><text x="85" y="887" font-size="31" font-weight="700" fill="#143762">원질문 대신 분류 결과를 운영 로그에 기록</text><text x="85" y="938" font-size="26" font-weight="400" fill="#52637e">목적 코드 · 분류 상태 → 응답 · 클릭 · 공유 · 후속 질문 연결</text></g></svg>