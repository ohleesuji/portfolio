<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050"><rect width="1200" height="1050" rx="22" fill="white"/><g font-family="Pretendard,Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="50" y="70" font-size="36" font-weight="750" fill="#143762">대화를 나눠 분석하고 한 답변으로 연결</text><rect x="50" y="112" width="1100" height="140" rx="14" fill="#f4f7fc" stroke="#dbe4f1" stroke-width="2"/><text x="80" y="164" font-size="29" font-weight="700" fill="#143762">긴 대화를 여러 구간으로 나누기</text><text x="80" y="213" font-size="27" font-weight="400" fill="#52637e">한 번에 읽을 수 있는 양에 맞춰 대화 나누기</text><text x="574" y="294" font-size="36" font-weight="600" fill="#8a9bb6">↓</text><rect x="50" y="320" width="334" height="110" rx="14" fill="#edf3ff" stroke="#cbd9f1" stroke-width="2"/><text x="84" y="384" font-size="29" font-weight="700" fill="#143762">구간 1 분석</text><rect x="433" y="320" width="334" height="110" rx="14" fill="#edf3ff" stroke="#cbd9f1" stroke-width="2"/><text x="467" y="384" font-size="29" font-weight="700" fill="#143762">구간 2 분석</text><rect x="816" y="320" width="334" height="110" rx="14" fill="#edf3ff" stroke="#cbd9f1" stroke-width="2"/><text x="850" y="384" font-size="29" font-weight="700" fill="#143762">구간 N 분석</text><text x="95" y="480" font-size="28" font-weight="500" fill="#52637e">동시에 읽되 서버 부하에 맞춰 분석할 구간 수 조절</text><text x="574" y="529" font-size="36" font-weight="600" fill="#8a9bb6">↓</text><rect x="50" y="554" width="1100" height="183" rx="14" fill="#f4f7fc" stroke="#dbe4f1" stroke-width="2"/><text x="80" y="608" font-size="30" font-weight="700" fill="#143762">각 구간의 내용을 하나로 연결</text><text x="80" y="656" font-size="27" font-weight="400" fill="#52637e">대화 시간순으로 정리 · 같은 내용은 한 번만 포함</text><text x="80" y="702" font-size="26" font-weight="400" fill="#52637e">서로 다른 내용이 나오면 확인된 내용만 답변에 포함</text><text x="574" y="783" font-size="36" font-weight="600" fill="#8a9bb6">↓</text><rect x="50" y="804" width="1100" height="94" rx="14" fill="#143762" stroke="#143762" stroke-width="2"/><text x="80" y="864" font-size="31" font-weight="700" fill="white">모은 내용을 바탕으로 처음 질문에 답변</text><text x="55" y="960" font-size="26" font-weight="700" fill="#9d4c11">분석 실패</text><text x="250" y="960" font-size="25" font-weight="400" fill="#52637e">실패한 부분만 다시 분석 · 끝내 실패하면 미완성 답변 차단</text><text x="55" y="1008" font-size="26" font-weight="700" fill="#143762">내용 없음</text><text x="250" y="1008" font-size="25" font-weight="400" fill="#52637e">분석은 끝났지만 대화에 해당 내용이 없다고 안내</text></g></svg>