<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="title">
<title id="title">나눠 읽은 대화를 시간순으로 통합</title>
<rect x="0" y="0" width="1200" height="380" rx="22" fill="#f1f5fa"/>
<text x="35" y="55" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-size="38" font-weight="700" fill="#002c5f" text-anchor="start" xml:space="preserve">나눠 읽은 대화를 시간순으로 통합</text>
<rect x="35" y="82" width="535" height="125" rx="16" fill="#ffffff"/>
<rect x="630" y="82" width="535" height="125" rx="16" fill="#ffffff"/>
<text x="61" y="128" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-size="28" font-weight="700" fill="#002c5f" text-anchor="start" xml:space="preserve">앞 대화</text>
<text x="656" y="128" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-size="28" font-weight="700" fill="#002c5f" text-anchor="start" xml:space="preserve">뒤 대화</text>
<text x="61" y="172" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-size="32" font-weight="400" fill="#172334" text-anchor="start" xml:space="preserve">“강남에서 만나자”</text>
<text x="656" y="172" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-size="32" font-weight="400" fill="#172334" text-anchor="start" xml:space="preserve">“홍대로 바꾸자”</text>
<text x="303" y="248" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-size="36" font-weight="700" fill="#2262ba" text-anchor="middle" xml:space="preserve">↓</text>
<text x="898" y="248" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-size="36" font-weight="700" fill="#2262ba" text-anchor="middle" xml:space="preserve">↓</text>
<rect x="35" y="269" width="1130" height="81" rx="16" fill="#ffffff"/>
<text x="61" y="320" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-size="30" font-weight="700" fill="#002c5f" text-anchor="start" xml:space="preserve">최종 약속 장소</text>
<text x="268" y="320" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-size="36" font-weight="700" fill="#2262ba" text-anchor="start" xml:space="preserve">홍대</text>
<text x="1139" y="320" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-size="27" font-weight="400" fill="#50637c" text-anchor="end" xml:space="preserve">나중에 바뀐 장소를 최종 답변에 반영</text>
</svg>
