<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050"><rect width="1200" height="1050" rx="22" fill="white"/><g font-family="Pretendard,Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="50" y="70" font-size="36" font-weight="750" fill="#143762">청킹·병렬 분석과 응답 통합</text><rect x="50" y="112" width="1100" height="140" rx="14" fill="#f4f7fc" stroke="#dbe4f1" stroke-width="2"/><text x="80" y="164" font-size="29" font-weight="700" fill="#143762">대화 분할</text><text x="80" y="213" font-size="27" font-weight="400" fill="#52637e">분석할 대화를 입력 크기에 맞는 여러 구간으로 나누기</text><text x="574" y="294" font-size="36" font-weight="600" fill="#8a9bb6">↓</text><rect x="50" y="320" width="334" height="110" rx="14" fill="#edf3ff" stroke="#cbd9f1" stroke-width="2"/><text x="84" y="384" font-size="29" font-weight="700" fill="#143762">구간 1 분석</text><rect x="433" y="320" width="334" height="110" rx="14" fill="#edf3ff" stroke="#cbd9f1" stroke-width="2"/><text x="467" y="384" font-size="29" font-weight="700" fill="#143762">구간 2 분석</text><rect x="816" y="320" width="334" height="110" rx="14" fill="#edf3ff" stroke="#cbd9f1" stroke-width="2"/><text x="850" y="384" font-size="29" font-weight="700" fill="#143762">구간 N 분석</text><text x="95" y="480" font-size="28" font-weight="500" fill="#52637e">동시에 분석하되 최대 동시 처리량 관리</text><text x="574" y="529" font-size="36" font-weight="600" fill="#8a9bb6">↓</text><rect x="50" y="554" width="1100" height="183" rx="14" fill="#f4f7fc" stroke="#dbe4f1" stroke-width="2"/><text x="80" y="608" font-size="30" font-weight="700" fill="#143762">근거 선별·맥락 통합</text><text x="80" y="656" font-size="27" font-weight="400" fill="#52637e">원래 순서 복원 · 중복 제거 · 구간을 넘는 사건 연결</text><text x="80" y="702" font-size="26" font-weight="400" fill="#52637e">결과가 충돌하면 임의로 확정하지 않고 불확실성 유지</text><text x="574" y="783" font-size="36" font-weight="600" fill="#8a9bb6">↓</text><rect x="50" y="804" width="1100" height="94" rx="14" fill="#143762" stroke="#143762" stroke-width="2"/><text x="80" y="864" font-size="31" font-weight="700" fill="white">통합한 분석 결과로 원래 질문에 최종 응답</text><text x="55" y="960" font-size="26" font-weight="700" fill="#9d4c11">실행 실패</text><text x="250" y="960" font-size="25" font-weight="400" fill="#52637e">실패 구간만 재시도 · 최종 실패 시 부분 응답 차단</text><text x="55" y="1008" font-size="26" font-weight="700" fill="#143762">근거 없음</text><text x="250" y="1008" font-size="25" font-weight="400" fill="#52637e">정상 완료와 구분해 “찾을 수 없음” 흐름으로 처리</text></g></svg>