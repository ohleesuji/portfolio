<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1160" viewBox="0 0 1200 1160"><rect width="1200" height="1160" rx="20" fill="white"/><g font-family="Pretendard,Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="50" y="70" font-size="36" fill="#143762" font-weight="750">개인화 메모리 저장·관리 흐름</text><rect x="50" y="110" width="1100" height="125" rx="14" fill="#f5f7fc" stroke="#d7e1f0" stroke-width="2"/><text x="80" y="160" font-size="30" fill="#143762" font-weight="700">사용자 대화와 현재 기억 확인</text><text x="80" y="207" font-size="26" fill="#52637e" font-weight="400">누구의 정보인지 · 무엇이 새로 확인되거나 바뀌었는지 판단</text><text x="575" y="280" font-size="36" fill="#8a9bb6" font-weight="600">↓</text><rect x="50" y="310" width="535" height="275" rx="14" fill="#f5f7fc" stroke="#d7e1f0" stroke-width="2"/><rect x="615" y="310" width="535" height="275" rx="14" fill="#f5f7fc" stroke="#d7e1f0" stroke-width="2"/><text x="80" y="360" font-size="29" fill="#143762" font-weight="700">대화에서 필요한 정보 선별</text><text x="80" y="417" font-size="25" fill="#52637e" font-weight="400">지속해서 쓸 정보 → 저장·갱신</text><text x="80" y="471" font-size="25" fill="#52637e" font-weight="400">지속성 확인 필요 → 기억 후보</text><text x="80" y="525" font-size="25" fill="#52637e" font-weight="400">일회성 질문·추측 → 저장 제외</text><text x="645" y="360" font-size="29" fill="#143762" font-weight="700">사용자의 기억 관리 요청</text><text x="645" y="410" font-size="25" fill="#52637e" font-weight="400">기억해줘 → 저장</text><text x="645" y="455" font-size="25" fill="#52637e" font-weight="400">고쳐줘 → 바뀐 부분만 수정</text><text x="645" y="500" font-size="25" fill="#52637e" font-weight="400">지워줘 → 현재 기억 삭제</text><text x="645" y="545" font-size="25" fill="#52637e" font-weight="400">기억하지 마 → 향후 저장 금지</text><rect x="50" y="625" width="1100" height="180" rx="14" fill="#edf3ff" stroke="#cbd9f1" stroke-width="2"/><text x="80" y="675" font-size="29" fill="#143762" font-weight="700">기억 후보 · 메모리 시그널</text><text x="80" y="721" font-size="25" fill="#52637e" font-weight="400">한 번의 질문을 취향으로 확정하지 않되, 이어지는 관심은 놓치지 않기</text><text x="80" y="767" font-size="25" fill="#143762" font-weight="600">같은 후보 갱신 → 지속성 확인 시 정식 기억 / 일회성이면 정리</text><rect x="50" y="840" width="1100" height="180" rx="14" fill="#fff4e9" stroke="#f3d4b4" stroke-width="2"/><text x="80" y="890" font-size="29" fill="#9d4c11" font-weight="700">앞으로 저장하지 않을 범위 · 서프레션</text><text x="80" y="936" font-size="25" fill="#52637e" font-weight="400">삭제는 현재 내용 제거, 저장 금지는 이후 같은 정보의 재저장 방지</text><text x="80" y="982" font-size="24" fill="#9d4c11" font-weight="600">다시 언급해도 금지 유지 · 명시적으로 다시 기억해 달라고 요청하면 재개</text><text x="50" y="1080" font-size="26" fill="#143762" font-weight="600">추가·수정 전 개인·민감정보 검사 · 기능 끄기와 기억 삭제를 구분</text></g></svg>