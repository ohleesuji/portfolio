<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 408" width="1200" height="408" role="img" aria-labelledby="title">
<title id="title">같은 대화의 입력 형식 비교</title>
<rect x="0" y="0" width="1200" height="408" rx="22" fill="#f1f5fa"/>
<text x="35" y="55" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-size="38" font-weight="700" fill="#002c5f" text-anchor="start" xml:space="preserve">같은 대화의 입력 형식 비교</text>
<rect x="35" y="82" width="535" height="238" rx="16" fill="#ffffff"/>
<rect x="630" y="82" width="535" height="238" rx="16" fill="#ffffff"/>
<text x="59" y="126" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-size="30" font-weight="700" fill="#002c5f" text-anchor="start" xml:space="preserve">변경 전 / JSON 일부</text>
<text x="654" y="126" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-size="30" font-weight="700" fill="#002c5f" text-anchor="start" xml:space="preserve">변경 후 / 플랫 텍스트 일부</text>
<text x="601" y="225" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-size="42" font-weight="700" fill="#2262ba" text-anchor="middle" xml:space="preserve">→</text>
<text x="59" y="163" font-family="Menlo, Apple SD Gothic Neo, monospace" font-size="22" font-weight="400" fill="#172334" text-anchor="start" xml:space="preserve">"chatName": "1번 채팅방",</text>
<text x="59" y="189" font-family="Menlo, Apple SD Gothic Neo, monospace" font-size="22" font-weight="400" fill="#172334" text-anchor="start" xml:space="preserve">"chatLogs": [</text>
<text x="59" y="215" font-family="Menlo, Apple SD Gothic Neo, monospace" font-size="22" font-weight="400" fill="#172334" text-anchor="start" xml:space="preserve">  {"logId": 1234, "message": "메시지1",</text>
<text x="59" y="241" font-family="Menlo, Apple SD Gothic Neo, monospace" font-size="22" font-weight="400" fill="#172334" text-anchor="start" xml:space="preserve">   "nickname":"나에요","isMe":true,…},</text>
<text x="59" y="267" font-family="Menlo, Apple SD Gothic Neo, monospace" font-size="22" font-weight="400" fill="#172334" text-anchor="start" xml:space="preserve">  {"logId": 1235, "message": "메시지2",</text>
<text x="59" y="293" font-family="Menlo, Apple SD Gothic Neo, monospace" font-size="22" font-weight="400" fill="#172334" text-anchor="start" xml:space="preserve">   "nickname":"홍길동","isMe":false,…}]</text>
<text x="654" y="165" font-family="Menlo, Apple SD Gothic Neo, monospace" font-size="23" font-weight="400" fill="#172334" text-anchor="start" xml:space="preserve">@CHAT cn="1번 채팅방" ci=123456 …</text>
<text x="654" y="202" font-family="Menlo, Apple SD Gothic Neo, monospace" font-size="23" font-weight="400" fill="#172334" text-anchor="start" xml:space="preserve">@D 2026-03-02</text>
<text x="654" y="239" font-family="Menlo, Apple SD Gothic Neo, monospace" font-size="23" font-weight="400" fill="#172334" text-anchor="start" xml:space="preserve">12:40 l=1234 ME: 메시지1</text>
<text x="654" y="276" font-family="Menlo, Apple SD Gothic Neo, monospace" font-size="23" font-weight="400" fill="#172334" text-anchor="start" xml:space="preserve">13:03 l=1235 OT(홍길동): 메시지2</text>
<text x="35" y="371" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-size="32" font-weight="700" fill="#2262ba" text-anchor="start" xml:space="preserve">같은 대화의 예상 입력 토큰 / 약 17,000 → 6,900</text>
</svg>
