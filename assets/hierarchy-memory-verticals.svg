<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060"><rect width="1200" height="1060" rx="22" fill="white"/><g font-family="Pretendard,Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="50" y="70" font-size="36" font-weight="750" fill="#143762">장소·쇼핑 등에서 함께 쓰는 개인화 메모리</text><rect x="50" y="110" width="1100" height="102" rx="14" fill="#f4f7fc" stroke="#dbe4f1" stroke-width="2"/><text x="80" y="155" font-size="29" font-weight="700" fill="#143762">사용자 대화</text><text x="80" y="192" font-size="25" font-weight="400" fill="#52637e">취향·생활 정보·계획 · 원하는 답변 방식</text><text x="575" y="253" font-size="36" font-weight="600" fill="#8a9bb6">↓</text><rect x="50" y="280" width="1100" height="155" rx="14" fill="#edf3ff" stroke="#cbd9f1" stroke-width="2"/><text x="80" y="328" font-size="30" font-weight="700" fill="#143762">공통 메모리 관리</text><text x="80" y="374" font-size="27" font-weight="400" fill="#52637e">다음에도 쓸 정보 고르기 → 저장·수정 → 각 서비스에 전달</text><text x="80" y="410" font-size="25" font-weight="400" fill="#52637e">사용자가 확인·수정·삭제 · 앞으로 저장하지 않을 내용 지정</text><text x="575" y="476" font-size="36" font-weight="600" fill="#8a9bb6">↓</text><rect x="50" y="507" width="535" height="165" rx="14" fill="#f4f7fc" stroke="#dbe4f1" stroke-width="2"/><text x="80" y="553" font-size="29" font-weight="700" fill="#143762">장소</text><text x="80" y="601" font-size="24" font-weight="400" fill="#52637e">함께 가는 사람·음식 취향·피할 조건</text><text x="80" y="640" font-size="24" font-weight="600" fill="#143762">취향에 맞는 장소 추천</text><rect x="615" y="507" width="535" height="165" rx="14" fill="#f4f7fc" stroke="#dbe4f1" stroke-width="2"/><text x="645" y="553" font-size="29" font-weight="700" fill="#143762">쇼핑</text><text x="645" y="601" font-size="24" font-weight="400" fill="#52637e">스타일·구매 계획·사용 조건</text><text x="645" y="640" font-size="24" font-weight="600" fill="#143762">스타일·예산에 맞는 상품 추천</text><rect x="50" y="697" width="535" height="165" rx="14" fill="#f4f7fc" stroke="#dbe4f1" stroke-width="2"/><text x="80" y="743" font-size="29" font-weight="700" fill="#143762">선톡</text><text x="80" y="791" font-size="24" font-weight="400" fill="#52637e">관심사·진행 중인 목표·일정</text><text x="80" y="830" font-size="24" font-weight="600" fill="#143762">준비에 도움이 되는 주제 선정</text><rect x="615" y="697" width="535" height="165" rx="14" fill="#f4f7fc" stroke="#dbe4f1" stroke-width="2"/><text x="645" y="743" font-size="29" font-weight="700" fill="#143762">사주</text><text x="645" y="791" font-size="24" font-weight="400" fill="#52637e">확인된 본인 정보·현재 고민</text><text x="645" y="830" font-size="24" font-weight="600" fill="#143762">알려준 정보를 다시 묻지 않고 대화</text><rect x="50" y="900" width="1100" height="110" rx="14" fill="#fff4e9" stroke="#f3d4b4" stroke-width="2"/><text x="80" y="945" font-size="26" font-weight="700" fill="#9d4c11">활용 기준</text><text x="80" y="984" font-size="27" font-weight="400" fill="#52637e">이번 질문에 필요한 메모리만 사용 · 이전 취향보다 이번 요청을 우선</text></g></svg>