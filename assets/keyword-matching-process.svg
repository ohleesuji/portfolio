<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1020" viewBox="0 0 960 1020"><rect width="960" height="1020" fill="white"/><g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="36" y="48" font-size="30" fill="#143762" font-weight="700">검색 기록을 광고에 쓸 관심사로 전환</text><rect x="36" y="80" width="888" height="195" rx="16" fill="#f6f8fc" stroke="#dfe6ef"/><circle cx="77" cy="122" r="22" fill="#143762"/><text x="77" y="130" text-anchor="middle" fill="white" font-size="22" font-weight="700">1</text><text x="116" y="131" font-size="28" font-weight="700" fill="#172033">키워드 매칭</text><text x="66" y="180" font-size="24" fill="#47546a">자사 DMP 검색어 + 이베이 키워드</text><text x="66" y="230" font-size="23" fill="#647087">최신 휴대폰 · 고성능 휴대폰</text><text x="884" y="230" text-anchor="end" font-size="23" font-weight="700" fill="#143762">휴대폰</text><path d="M480 281v17m-7-6 7 7 7-7" fill="none" stroke="#7287a8" stroke-width="3"/><rect x="36" y="305" width="888" height="195" rx="16" fill="#f6f8fc" stroke="#dfe6ef"/><circle cx="77" cy="347" r="22" fill="#143762"/><text x="77" y="355" text-anchor="middle" fill="white" font-size="22" font-weight="700">2</text><text x="116" y="356" font-size="28" font-weight="700" fill="#172033">최근 30일 데이터 적재</text><text x="66" y="405" font-size="24" fill="#47546a">이베이 기준 키워드로 통합 · 저장</text><text x="66" y="455" font-size="23" fill="#647087">쿠키별 검색 기록</text><text x="884" y="455" text-anchor="end" font-size="23" font-weight="700" fill="#143762">같은 관심사로 묶어 관리</text><path d="M480 506v17m-7-6 7 7 7-7" fill="none" stroke="#7287a8" stroke-width="3"/><rect x="36" y="530" width="888" height="195" rx="16" fill="#f6f8fc" stroke="#dfe6ef"/><circle cx="77" cy="572" r="22" fill="#143762"/><text x="77" y="580" text-anchor="middle" fill="white" font-size="22" font-weight="700">3</text><text x="116" y="581" font-size="28" font-weight="700" fill="#172033">최근 7일 관심사 점수화</text><text x="66" y="630" font-size="24" fill="#47546a">최신성 · 검색 빈도를 함께 반영</text><text x="66" y="680" font-size="23" fill="#647087">휴대폰 2.9점 / 노트북 1점</text><text x="884" y="680" text-anchor="end" font-size="23" font-weight="700" fill="#143762">쿠키별 최상위 1개 선정</text><path d="M480 731v17m-7-6 7 7 7-7" fill="none" stroke="#7287a8" stroke-width="3"/><rect x="36" y="755" width="888" height="195" rx="16" fill="#eff4ff" stroke="#dfe6ef"/><circle cx="77" cy="797" r="22" fill="#143762"/><text x="77" y="805" text-anchor="middle" fill="white" font-size="22" font-weight="700">4</text><text x="116" y="806" font-size="28" font-weight="700" fill="#172033">요청에 맞춰 키워드 전달</text><text x="66" y="855" font-size="24" fill="#47546a">이베이에 관심사 키워드 전달</text><text x="66" y="905" font-size="23" fill="#647087">전달 키워드: 휴대폰</text><text x="884" y="905" text-anchor="end" font-size="23" font-weight="700" fill="#143762">이베이에서 광고 상품 선별 · 송출</text><text x="480" y="1003" text-anchor="middle" font-size="22" fill="#143762">광고 요청 시 쿠키별 최상위 관심사 키워드 1개 전달</text></g></svg>