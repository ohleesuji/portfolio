<text x="500" y="865" font-size="22" fill="#55657a">중복 제거 · 맥락 연결 · 변경 사항 반영</text>
<path d="M500 894V930" fill="none" stroke="#63758d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="275" y="945" width="450" height="65" rx="12" fill="#143762"/>
<text x="500" y="986" font-size="27" fill="white" font-weight="700">하나의 최종 답변</text>
