<rect x="160" y="625" width="680" height="95" rx="12" fill="#edf3fb"/>
<text x="500" y="664" font-size="25" font-weight="700">전체 구간 분석 성공 후 근거 선별</text>
<text x="500" y="699" font-size="21" fill="#55657a">재시도 후에도 실패 시 오류 안내</text>
