<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px; background: #f7f8fb; color: #182239; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 680px); padding: clamp(32px, 6vw, 64px); background: #fff; border: 1px solid #e6e9f0; border-radius: 24px; box-shadow: 0 18px 55px rgba(24, 34, 57, .06); }
    .eyebrow { margin: 0 0 18px; color: #5268a9; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0 0 18px; font-size: clamp(32px, 6vw, 52px); line-height: 1.15; letter-spacing: -.045em; }
    p { margin: 0; color: #5f697a; font-size: 17px; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Portfolio</p>
    <h1>포트폴리오 준비 중</h1>
    <p>프로젝트와 경험을 정리해 곧 공개할 예정입니다.</p>
  </main>
</body>
</html>
